<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fa" />
    <title>LinguaLoop</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        try {
          const storageKey = 'lingualoop:spa-redirect';
          const redirect = window.sessionStorage.getItem(storageKey);

          if (!redirect) return;
          window.sessionStorage.removeItem(storageKey);

          const target = new URL(redirect);
          if (
            target.origin === window.location.origin &&
            target.pathname.startsWith('/LinguaLoop/')
          ) {
            window.history.replaceState(
              null,
              '',
              `${target.pathname}${target.search}${target.hash}`
            );
          }
        } catch {
          // The app still loads at its base URL if session storage is disabled.
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
